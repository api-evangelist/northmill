apis:
- name: Northmill Flo API
  description: The public REST API for Northmill Flo (formerly MoreFlo), Northmill Bank's point-of-sale
    and commerce platform for merchants. Swagger 2.0, 125 paths / 199 operations over articles and pricing,
    stock movements, article sets, campaigns, brands, groups, suppliers, locations, customers, cashier
    users, orders (v2 and v3), booking orders, ticket orders, service orders, vouchers, receipts, cash
    cards, SMS, accounting settings, online/webshop/self-scan/catering settings and webhook subscriptions.
    Every collection is available both merchant-wide and scoped to a single store via /v2/stores/{externalStoreId}/...
    HTTP Basic authentication; JSON, XML and form-encoded requests.
  humanURL: https://api.moreflo.com/swagger/ui/index
  baseURL: https://api.moreflo.com
