in_band_error_signalling:
  description: >-
    Failures are also reported inside a successful-looking envelope. Every *Result
    model carries these two fields, so a 200 does not mean the operation succeeded.
  fields:
    Success: 'boolean - "Indicates whether the API operation was successful."'
    ExtraInformation: >-
      'array of strings - "A list of extra information or messages related to the API
      operation result. This can include error messages, warnings, or informational
      notes."'
  consequence: >-
    A client MUST inspect Success and ExtraInformation on every 200 response. An agent
    that treats HTTP 200 as success will silently swallow business-rule failures.
gap_summary: >-
  No error type registry, no error codes, no problem+json, no documented status codes
  beyond 200, and no documented meaning for the free-text strings in ExtraInformation.
  This is the single largest contract-quality gap in the Northmill Flo API.
decline_codes:
  applicable: false
  note: >-
    Northmill Bank does issue cards and acquire card payments, and the Flo receipt
    model carries acquirer-level fields (AcquirerId, ApprovalCode, AuthorizationMethod,
    AuthorizationResponder, ReversalReference on BankCardTransaction). But the Flo API
    is a record-keeping surface for transactions already authorised at the terminal -
    it exposes no authorisation endpoint and Northmill publishes no decline-code
    reference. errors/northmill-decline-codes.yml is therefore not written.
