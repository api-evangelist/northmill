aid: northmill
name: Northmill
description: Northmill Bank AB is a Swedish technology-driven bank, founded in Stockholm in 2006 and licensed
  by Finansinspektionen in 2019, that serves roughly 600,000 private customers and 2,500 businesses across
  Sweden, Norway and Finland with savings accounts, cards, personal and business lending, business accounts,
  Swish and card acquiring. Through its Northmill Flo business unit (formerly MoreFlo, acquired and rebranded)
  it also ships point-of-sale, booking, checkout and e-commerce products for retail and hospitality merchants.
  Its public developer surface is the Flo API - a Swagger 2.0 REST contract published at api.moreflo.com
  with 199 operations over articles, stock, orders, receipts, customers, bookings, campaigns, vouchers,
  SMS and webhooks - alongside a PSD2 open-banking interface for third-party providers documented under
  the Northmill Bank brand and delivered on Token.io infrastructure.
