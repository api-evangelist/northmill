    MoreFlo.Models.InterfaceModels.Receipts.ControlUnit:
      description: 'Represents a tax control unit and its associated control code.

        This class encapsulates information about a tax control unit, including its unique identifier and the control code it provides.'
      required:
      - UnitId
      type: object
      properties:
        UnitId:
          description: The unit identifier of the tax control unit.
          maxLength: 50
          minLength: 0
          type: string
        ControlCode:
          description: The control code received from the tax control unit.
          maxLength: 100
          minLength: 0
          type: string
    MoreFlo.Models.InterfaceModels.Receipts.Merchant:
      description: Represents merchant information, including identification, contact details, and address.
      required:
      - CorporateIdentityNumber
      - Name
      type: object
      properties:
        CorporateIdentityNumber:
          description: The corporate identity number of the merchant (e.g., SSN, Organization number).
          type: string
        Name:
          description: The name of the company or merchant.
          maxLength: 128
          minLength: 0
          type: string
        AddressLine1:
          description: The first line of the merchant's address.
          maxLength: 128
          minLength: 0
          type: string
        AddressLine2:
          description: The second line of the merchant's address (optional).
          maxLength: 128
          minLength: 0
          type: string
        ZipCode:
          description: The postal code of the merchant's address.
          maxLength: 128
          minLength: 0
          type: string
        City:
          description: The city of the merchant's address.
          maxLength: 128
          minLength: 0
          type: string
        Country:
          description: The country of the merchant's address.
          maxLength: 128
          minLength: 0
          type: string
        Phone:
          description: The merchant's landline or cell phone number.
          maxLength: 128
          minLength: 0
          type: string
        HomePage:
          description: The merchant's home page address (URL).
          maxLength: 128
          minLength: 0
          type: string
        Email:
          description: The merchant's email address.
          maxLength: 128
          minLength: 0
          type: string
    MoreFlo.Models.InterfaceModels.Receipts.Recipient:
      description: 'Represents a recipient of a receipt, specifying the delivery method and contact information.

        This class encapsulates information about how a receipt should be sent to a customer, either by email or SMS.'
      type: object
      properties:
        Carrier:
          description: Specifies the carrier used to send the receipt, either Email or SMS.
          enum:
          - Email
          - SMS
          type: string
        EmailAddress:
          description: The email address of the recipient, if the Carrier is Email.
          type: string
        MobilePhone:
          description: The mobile phone number of the recipient, if the Carrier is SMS.
          type: string
    MoreFlo.Models.InterfaceModels.Receipts.Rounding:
      description: 'Represents the rounding applied to the total amount of a receipt.

        This class encapsulates information about the adjustment made to the receipt total due to rounding to a specific denomination.'
      required:
      - Amount
      type: object
      properties:
        Amount:
          format: double
          description: The total rounding amount applied to the receipt.
          type: number
    MoreFlo.Models.InterfaceModels.Receipts.Customer:
      description: 'Represents customer information.

        This class encapsulates data related to a customer, including their customer number, name, and customer type.'
      required:
      - CustomerNumber
      type: object
      properties:
        CustomerNumber:
          description: The unique customer number.
          maxLength: 128
          minLength: 0
          type: string
        CompanyName:
          description: The company name, if the customer is a company.
          maxLength: 100
          minLength: 0
          type: string
        Fullname:
          description: The full name of the customer.
          maxLength: 100
          minLength: 0
          type: string
        CustomerType:
          description: The type of customer.
          enum:
          - Private
          - Company
          type: string
