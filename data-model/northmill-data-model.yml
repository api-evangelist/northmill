notes:
- Create/Update variants (ArticleCreate, OrderCreate, CustomerUpdate ...) mirror their base entity and
  are kept in the graph because they carry the write-side fields (UpdateOnExisting, upsert keys).
- 'Receipt is the richest aggregate in the model: it fans out to Merchant, ControlUnit, Rounding, Customers,
  Articles, Payments, Vat, Orders, Discounts, Recipients, TextRows, ClientDetails and Voucher.'
- ControlUnit (UnitId + ControlCode) is the Swedish tax control-unit stamp required of a certified cash
  register - see conformance/northmill-conformance.yml.
- The relationship set is derived purely from $ref edges; scalar id-reference fields (BookableResourceId,
  WebHookCategoryId, ArticleNumber on rows) imply further edges that the Swagger document does not express
  as $ref.
