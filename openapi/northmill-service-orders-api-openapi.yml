        required: true
  /v2/serviceorders/{Id}:
    get:
      tags:
      - Service Orders
      summary: Get a service order
      operationId: ServiceOrders_Get
      parameters:
      - name: Id
        in: path
        description: External reference of the service order.
        required: true
        schema:
          type: string
      - name: externalStoreId
        in: query
        description: ''
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
