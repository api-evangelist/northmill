- name: Northmill Bank Open Banking API for TPPs
  description: 'Northmill Bank''s PSD2 third-party-provider interface, covering Account Information Services
    (AIS) and Confirmation of Available Funds (CBPII/CAF), with request signing via ES256/RS256 key pairs
    registered in the Northmill Bank Dashboard. OWNERSHIP NOTE: the interface is delivered by Token.io
    as Northmill Bank''s technical service provider - the developer documentation is Northmill-branded
    and Northmill-specific (Northmill Bank Dashboard at northmill.dashboard.token.io, a Northmill-imposed
    limit of 1,000 API requests per minute per TPP member) but the documented BASE_URL is Token.io''s
    shared platform host https://api.token.io, and the Swagger reference sits behind the dashboard sign-in.
    No machine-readable contract was captured for this API for that reason.'
  humanURL: https://developer.token.io/northmill_rest_api_doc/content/e-rest/dashboard-intro.htm
  baseURL: https://api.token.io
